services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: evalrag
      POSTGRES_USER: evalrag
      POSTGRES_PASSWORD: evalrag-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalrag -d evalrag"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/evalrag-local
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p evalrag-local 'RETURN 1' >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://evalrag:evalrag-local@postgres:5432/evalrag
      REDIS_URL: redis://redis:6379/0
      EVALRAG_LLM_BACKEND: ${EVALRAG_LLM_BACKEND:-fake}
      EVALRAG_MODEL: ${EVALRAG_MODEL:-deterministic-demo}
      EVALRAG_GIT_COMMIT: ${EVALRAG_GIT_COMMIT:-container-build}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TRACE_PATH: /app/traces/service/agent_trace.jsonl
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: evalrag-local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - traces_data:/app/traces
      - type: volume
        source: indexes_data
        target: /app/data/processed/indexes
        volume:
          nocopy: true

  worker:
    build: .
    command: ["python", "-m", "intern_rag.worker.main"]
    environment:
      DATABASE_URL: postgresql://evalrag:evalrag-local@postgres:5432/evalrag
      REDIS_URL: redis://redis:6379/0
      EVALUATION_TIMEOUT_SECONDS: 1800
      EVALRAG_GIT_COMMIT: ${EVALRAG_GIT_COMMIT:-container-build}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: evalrag-local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - reports_data:/app/reports
      - type: volume
        source: indexes_data
        target: /app/data/processed/indexes
        volume:
          nocopy: true

volumes:
  postgres_data:
  redis_data:
  reports_data:
  traces_data:
  indexes_data:
  neo4j_data:
