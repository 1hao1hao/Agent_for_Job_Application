name: P1 Service Integration

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compose-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose -f compose.yaml config --quiet

      - name: Start API, Worker, PostgreSQL, Redis and Neo4j
        run: EVALRAG_GIT_COMMIT=${GITHUB_SHA} docker compose -f compose.yaml up -d --build

      - name: Wait for API health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.yaml ps
          docker compose -f compose.yaml logs
          exit 1

      - name: Run Query and Trace flow
        run: |
          curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"query":"请分析大模型应用研发实习生的岗位要求","retriever":"bm25","top_k":5}' \
            http://localhost:8000/v1/query > /tmp/query.json
          python - <<'PY'
          import json
          import urllib.request
          payload = json.load(open('/tmp/query.json', encoding='utf-8'))
          assert payload['status'] == 'answered', payload
          assert payload['citations'], payload
          trace = json.load(urllib.request.urlopen(
              f"http://localhost:8000/v1/traces/{payload['trace_id']}"
          ))
          assert trace['retrieval']['retriever'] == 'bm25', trace
          print(json.dumps({'query_status': payload['status'], 'trace_id': payload['trace_id']}))
          PY

      - name: Run asynchronous Evaluation Job flow
        run: |
          curl --fail --silent \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: github-actions-p1-d1' \
            -d '{"dataset_version":"evalrag_v0.2","split":"dev","run_config":{"run_id":"p1-d1-compose-ci","retriever_config_path":"configs/retrieval/bm25_v0.2.json"}}' \
            http://localhost:8000/v1/evaluation-jobs > /tmp/job.json
          python - <<'PY'
          import json
          import time
          import urllib.request
          job = json.load(open('/tmp/job.json', encoding='utf-8'))
          url = f"http://localhost:8000/v1/evaluation-jobs/{job['job_id']}"
          for _ in range(120):
              current = json.load(urllib.request.urlopen(url))
              if current['status'] == 'succeeded':
                  assert current['report_path'], current
                  print(json.dumps(current))
                  break
              if current['status'] == 'failed':
                  raise AssertionError(current)
              time.sleep(1)
          else:
              raise TimeoutError('evaluation job did not finish')
          PY

      - name: Validate pgvector HNSW and Neo4j persistence
        run: |
          docker compose -f compose.yaml exec -T api \
            python scripts/validate_persistent_stores.py
          docker compose -f compose.yaml restart postgres neo4j
          for attempt in $(seq 1 60); do
            postgres_status=$(docker inspect --format='{{.State.Health.Status}}' \
              "$(docker compose -f compose.yaml ps -q postgres)")
            neo4j_status=$(docker inspect --format='{{.State.Health.Status}}' \
              "$(docker compose -f compose.yaml ps -q neo4j)")
            if [ "$postgres_status" = healthy ] && [ "$neo4j_status" = healthy ]; then
              docker compose -f compose.yaml exec -T api \
                python scripts/validate_persistent_stores.py --verify-only
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.yaml ps
          exit 1

      - name: Validate Context stores and PostgreSQL restart recovery
        run: |
          docker compose -f compose.yaml exec -T api \
            python scripts/validate_context_stores.py
          docker compose -f compose.yaml restart postgres
          for attempt in $(seq 1 60); do
            postgres_status=$(docker inspect --format='{{.State.Health.Status}}' \
              "$(docker compose -f compose.yaml ps -q postgres)")
            if [ "$postgres_status" = healthy ]; then
              docker compose -f compose.yaml exec -T api \
                python scripts/validate_context_stores.py --verify-only
              break
            fi
            sleep 2
          done
          test "$postgres_status" = healthy

      - name: Validate Redis unavailable fallback
        run: |
          docker compose -f compose.yaml stop redis
          docker compose -f compose.yaml exec -T api \
            python scripts/validate_context_stores.py \
              --verify-only --expect-cache-fallback
          docker compose -f compose.yaml start redis

      - name: Record container status
        run: docker compose -f compose.yaml ps

      - name: Show logs on failure
        if: failure()
        run: docker compose -f compose.yaml logs

      - name: Stop stack
        if: always()
        run: docker compose -f compose.yaml down -v
