name: Evaluation Gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  deterministic-evaluation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: evalrag-v03-bge-crossencoder-${{ runner.os }}
      - name: Install evaluation dependencies
        run: pip install -r requirements.txt
      - name: Build versioned retrieval indexes
        env:
          PYTHONPATH: src
        run: |
          python scripts/build_bm25_index.py --dataset-version evalrag_v0.3 --output data/processed/indexes/evalrag_v0.3/bm25-v1/index.json
          python scripts/build_dense_index.py --dataset-version evalrag_v0.3 --output-dir data/processed/indexes/evalrag_v0.3/bge-small-zh-v1.5 --model-name BAAI/bge-small-zh-v1.5 --revision 4de6f16ee484a86402c8d536c2239f7d3a3f1001
      - name: Run runtime, feedback and gate tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest \
            tests.unit.test_agent_runtime \
            tests.unit.test_router_feedback \
            tests.unit.test_ci_evaluation_gate \
            tests.unit.test_evidence_calibration \
            tests.unit.test_evidence \
            tests.regression.test_regression_suite -v
      - name: Run versioned evaluation gate
        env:
          PYTHONPATH: src
        run: python scripts/run_ci_evaluation_gate.py
      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-gate-artifacts
          path: reports/ci/evaluation-gate-v2/
